name: Validate Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t azure-app-platform-lab:test .

      - name: Start container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f test-app >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name test-app -p 8000:8000 azure-app-platform-lab:test

          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              echo "Container health check passed."
              exit 0
            fi
            echo "Waiting for application startup (${attempt}/15)..."
            sleep 2
          done

          echo "Container did not become healthy."
          docker logs test-app
          exit 1
