# ============================================
# Kubernetes Deployment — Azure App Platform Lab
# Exemplo didático para estudo de orquestração
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-app-platform-lab
  labels:
    app: azure-app-platform-lab
    project: dio-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azure-app-platform-lab
  template:
    metadata:
      labels:
        app: azure-app-platform-lab
    spec:
      containers:
        - name: app
          # PENDENTE: substituir pela imagem real após push para ACR ou Docker Hub
          image: azure-app-platform-lab:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_PORT
              value: "8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      restartPolicy: Always
